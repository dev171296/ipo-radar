name: Collect

on:
  workflow_dispatch:
  # Schedule stays commented out until we have watched a few manual runs.
  # Times are UTC; India is UTC+5:30, hence the :30 minutes.
  # schedule:
  #   - cron: '30 2 * * *'    # 08:00 IST
  #   - cron: '30 5 * * *'    # 11:00 IST
  #   - cron: '30 8 * * *'    # 14:00 IST
  #   - cron: '30 13 * * *'   # 19:00 IST

concurrency:
  group: collect
  cancel-in-progress: false     # never let two runs write at once

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write           # needed to commit the data back
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Collect
        run: python -m ipo_radar.run

      - name: Save the data back to the repo
        run: |
          git config user.name  "ipo-radar"
          git config user.email "ipo-radar@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "data: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
