name: Collect

on:
  # The button in the Actions tab still works, any time you want it.
  workflow_dispatch:

  # Four times a day, automatically.
  # GitHub runs these on UTC time. India is 5 hours 30 minutes ahead, which is
  # why every minute below is :30 rather than :00.
  schedule:
    - cron: '30 2 * * *'     # 08:00 IST — morning check
    - cron: '30 5 * * *'     # 11:00 IST — mid-morning
    - cron: '30 8 * * *'     # 14:00 IST — afternoon, before applications close
    - cron: '30 13 * * *'    # 19:00 IST — evening, after the market settles

concurrency:
  group: collect
  cancel-in-progress: false     # never let two runs write at once

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write           # needed to commit the data back
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the save step below can rebase cleanly when two
          # runs land close together.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Collect
        run: python -m ipo_radar.run

      - name: Save the data back to the repo
        run: |
          git config user.name  "ipo-radar"
          git config user.email "ipo-radar@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "data: $(date -u '+%Y-%m-%d %H:%M') UTC"

          # Another run (or you, from your Mac) may have saved something while
          # this one was working. Take their changes first, put ours on top,
          # then try again. Our files are append-only, so there is nothing to
          # argue about — the two sets of changes simply stack.
          for attempt in 1 2 3; do
            if git push; then
              echo "saved on attempt $attempt"
              exit 0
            fi
            echo "someone else saved first — catching up, attempt $attempt"
            git pull --rebase --autostash origin main
            sleep 3
          done
          echo "could not save after 3 attempts"
          exit 1
