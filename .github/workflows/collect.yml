name: Collect

on:
  # The button in the Actions tab still works, any time you want it.
  workflow_dispatch:

  # Four times a day, automatically.
  # GitHub runs these on UTC time. India is 5 hours 30 minutes ahead, which is
  # why every minute below is :30 rather than :00.
  schedule:
    - cron: '30 2 * * *'     # 08:00 IST — morning check
    - cron: '30 5 * * *'     # 11:00 IST — mid-morning
    - cron: '30 8 * * *'     # 14:00 IST — afternoon, before applications close
    - cron: '30 13 * * *'    # 19:00 IST — evening, after the market settles

concurrency:
  group: collect
  cancel-in-progress: false     # never let two runs write at once

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write           # needed to commit the data back
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the save step below can rebase cleanly when two
          # runs land close together.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Collect
        env:
          PYTHONUNBUFFERED: "1"   # print as it happens, not all at the end
        run: python -m ipo_radar.run

      - name: Save the data back to the repo
        run: |
          git config user.name  "ipo-radar"
          git config user.email "ipo-radar@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "data: $(date -u '+%Y-%m-%d %H:%M') UTC"

          # Another run may have saved while this one was working. Combine the
          # two rather than choosing between them:
          #   history and log files  -> keep BOTH sets of lines (.gitattributes)
          #   index.json, ipos/*.json -> keep ours; they are rebuilt from history
          #                              every run, so nothing is lost
          for attempt in 1 2 3; do
            if git push; then
              echo "saved on attempt $attempt"
              exit 0
            fi
            echo "someone else saved first — merging, attempt $attempt"
            git fetch origin main
            git merge -X ours --no-edit origin/main || {
              echo "merge still stuck — keeping our version of the derived files"
              git checkout --ours -- data/ || true
              git add data/
              git commit --no-edit || true
            }
            sleep 3
          done
          echo "could not save after 3 attempts"
          exit 1
