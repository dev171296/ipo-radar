name: Source probe

# Diagnostics. Run when a source starts misbehaving, or to test a new one.
on:
  workflow_dispatch:
    inputs:
      which:
        description: 'Which probe to run'
        required: true
        default: '3'
        type: choice
        options: ['2', '3']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run the probe
        env:
          IPOGURU_KEY: ${{ secrets.IPOGURU_KEY }}
        run: python probe${{ inputs.which }}.py
