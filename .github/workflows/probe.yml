name: Source probe

# Manual only. Click "Run workflow" in the Actions tab.
# No schedule yet — we are still finding out what works.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Run the probe
        env:
          IPOGURU_KEY: ${{ secrets.IPOGURU_KEY }}
        run: python probe.py
